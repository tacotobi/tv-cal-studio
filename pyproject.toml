[project]
name = "tvcal"
version = "0.1.0"
description = "Kalibrering av Xiaomi MiTV-MOEU0 med i1Display Pro via egen app på TV:n"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tvcal = "tvcal.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tvcal"]
